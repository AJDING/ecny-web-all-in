# One-click Render blueprint: web service + Postgres. Set the secret env vars in the Render dashboard.
databases:
  - name: all-in-db
    plan: basic-256mb
services:
  - type: web
    name: all-in
    runtime: docker
    plan: starter
    healthCheckPath: /up
    preDeployCommand: bin/rails db:prepare db:seed
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: all-in-db, property: connectionString }
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: APP_HOST
        value: allin.encounterny.com
      - key: CHURCH_NAME
        value: Encounter Church
      - key: CHURCH_EMAIL
        value: Connect@EncounterNY.com
      - key: SCHEDULING_URL
        sync: false
      - key: ALL_IN_GATHERING_URL
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: All In <allin@encounterny.com>
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: all-in-media
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
